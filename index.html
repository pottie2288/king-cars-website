<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>King Cars | Quality Pre-Owned Cars in Cape Town &amp; Port Elizabeth</title>
    <meta name="description" content="Browse 28+ brands of affordable, reliable pre-owned cars. Every vehicle includes a 2-year unlimited km warranty. Finance available. Branches in Bellville, Brackenfell &amp; Port Elizabeth." />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.kingcars.co.za/" />

    <!-- Open Graph -->
    <meta property="og:title" content="King Cars | Quality Pre-Owned Cars in Cape Town &amp; Port Elizabeth" />
    <meta property="og:description" content="Affordable pre-owned cars with 2-year unlimited km warranty. 28+ brands. Finance available. WhatsApp us today." />
    <meta property="og:image" content="https://www.kingcars.co.za/og-image.jpg" />
    <meta property="og:url" content="https://www.kingcars.co.za/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:site_name" content="King Cars" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="King Cars | Pre-Owned Cars Cape Town &amp; PE" />
    <meta name="twitter:description" content="28+ brands. 2-year warranty. Finance available. Branches in Cape Town &amp; Port Elizabeth." />
    <meta name="twitter:image" content="https://www.kingcars.co.za/og-image.jpg" />

    <!-- Geo Targeting -->
    <meta name="geo.region" content="ZA-WC" />
    <meta name="geo.placename" content="Cape Town" />
    <meta name="geo.position" content="-33.9;18.6" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/king-cars-logo.png" />
    <link rel="apple-touch-icon" href="/king-cars-logo.png" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- LocalBusiness Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "AutoDealer",
      "name": "King Cars",
      "description": "Quality pre-owned car dealership in Cape Town and Port Elizabeth. 28+ brands with 2-year unlimited km warranty.",
      "url": "https://www.kingcars.co.za",
      "logo": "https://www.kingcars.co.za/king-cars-logo.png",
      "telephone": "+27835008181",
      "priceRange": "R150000 - R350000",
      "currenciesAccepted": "ZAR",
      "paymentAccepted": "Cash, Finance, Trade-In",
      "areaServed": [
        { "@type": "City", "name": "Cape Town" },
        { "@type": "City", "name": "Port Elizabeth" },
        { "@type": "City", "name": "Bellville" },
        { "@type": "City", "name": "Brackenfell" }
      ],
      "address": [
        {
          "@type": "PostalAddress",
          "addressLocality": "Bellville",
          "addressRegion": "Western Cape",
          "addressCountry": "ZA"
        },
        {
          "@type": "PostalAddress",
          "addressLocality": "Brackenfell",
          "addressRegion": "Western Cape",
          "addressCountry": "ZA"
        },
        {
          "@type": "PostalAddress",
          "addressLocality": "Port Elizabeth",
          "addressRegion": "Eastern Cape",
          "addressCountry": "ZA"
        }
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Pre-Owned Vehicles",
        "itemListElement": [
          {
            "@type": "OfferCatalog",
            "name": "Used Cars",
            "description": "Quality pre-owned vehicles with 2-year unlimited km warranty"
          }
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
